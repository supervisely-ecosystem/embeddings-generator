services:
  clip-as-service-local:
    image: supervisely/deploy-cas:0.1.3
    pull_policy: always
    entrypoint: ["python", "-m", "clip_server", "/app/clip.yml"]
    volumes:
      - ./clip.yml:/app/clip.yml:ro
    deploy:
      resources:
        limits:
          memory: 6G
    ports:
      - 34600:8000
  qdrant-local:
    deploy:
      resources:
        limits:
          memory: 6G
    image: ${CORE_DOCKER_REGISTRY}/dockerhub/qdrant/qdrant
    logging:
      driver: local
      options:
        compress: "false"
        max-file: "1"
        max-size: 1m
    restart: "no"
    runtime: runc
    ports:
      - "34603:6333"
      - "34604:6334"
  embeddings-generator:
    image: supervisely/embeddings-generator:${GENERATOR_VERSION}
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    deploy:
      resources:
        limits:
          memory: 4G
    environment:
      ENV: "${ENV}" # production, development, etc.
      LOG_LEVEL: "${LOG_LEVEL}"
      SERVER_ADDRESS: "${SERVER_ADDRESS}" # one of the public or internal addresses of the Supervisely server must be provided
      SUPERVISELY_API_SERVER_ADDRESS: "${SUPERVISELY_API_SERVER_ADDRESS}" # one of the public or internal addresses of the Supervisely server must be provided
      SUPERVISELY_NET_SERVER_ADDRESS: "${SUPERVISELY_NET_SERVER_ADDRESS}" # Supervisely network endpoint, e.g. http://sly-net-server
      SUPERVISELY_API_ACCESS_TOKEN: "${SUPERVISELY_API_ACCESS_TOKEN}" # access token for Supervisely API
      API_TOKEN: "${API_TOKEN}" # you could set token for both publick and internal addresses, in case of internal address it will skip retrieving token from the server
      QDRANT_HOST: "http://10.62.10.13:34603"
      CLIP_HOST: "${CLIP_HOST}" # CLIP application service, using local service from docker-compose
      IMGPROXY_ADDRESS: "${IMGPROXY_ADDRESS}" # Imgproxy service, e.g. http://imgproxy/
      IMGPROXY_CONCURRENCY: "${IMGPROXY_CONCURRENCY}" # concurrency for Imgproxy service
    labels:
      proxy.app: embeddings-generator
      supervisely.logs.app: embeddings-generator-dev
    volumes:
      - ./src:/app/src:ro
      - ./project_embeddings_state:/app/state
    restart: unless-stopped
    logging:
      driver: local
      options:
        compress: "false"
    ports:
      - 34601:80
 
  embeddings-auto-updater:
    image: supervisely/embeddings-auto-updater:${AUTO_UPDATER_VERSION}
    deploy:
      resources:
        limits:
          memory: 4G
    environment:
      ENV: "production" # production, development, etc.
      LOG_LEVEL: "${LOG_LEVEL}"
      SERVER_ADDRESS: "${SERVER_ADDRESS}" # one of the public or internal addresses of the Supervisely server must be provided
      SUPERVISELY_API_SERVER_ADDRESS: "${SUPERVISELY_API_SERVER_ADDRESS}" # one of the public or internal addresses of the Supervisely server must be provided
      SUPERVISELY_NET_SERVER_ADDRESS: "${SUPERVISELY_NET_SERVER_ADDRESS}" # Supervisely network endpoint, e.g. http://sly-net-server
      SUPERVISELY_API_ACCESS_TOKEN: "${SUPERVISELY_API_ACCESS_TOKEN}" # access token for Supervisely API
      API_TOKEN: "${API_TOKEN}" # you could set token for both publick and internal addresses, in case of internal address it will skip retrieving token from the server
      QDRANT_HOST: "http://10.62.10.13:34603"
      CLIP_HOST: "${CLIP_HOST}" # CLIP application service, using local service from docker-compose
      GENERATOR_HOST: "embeddings-generator" # embeddings generator service, must be provided
      IMGPROXY_ADDRESS: "${IMGPROXY_ADDRESS}" # Imgproxy service, e.g. http://imgproxy/
      IMGPROXY_CONCURRENCY: "${IMGPROXY_CONCURRENCY}" # concurrency for Imgproxy service
      UPDATE_INTERVAL: ${UPDATE_INTERVAL} # minutes, default is 10 minutes
      UPDATE_FRAME: ${UPDATE_FRAME} # hours, default is 12 hours
    labels:
      proxy.app: embeddings-auto-updater
      supervisely.logs.app: embeddings-auto-updater-dev
    volumes:
      - ./project_embeddings_autostate:/app/state
    restart: unless-stopped
    logging:
      driver: local
      options:
        compress: "false"
    ports:
      - 34602:80

  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.0
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"

networks:
  default:
    name: milvus